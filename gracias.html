<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050b18">
  <meta name="robots" content="noindex,nofollow">
  <title>Solicitud recibida | HexaSec S.A.S.</title>
  <link rel="stylesheet" href="./css/styles.css?v=19">
  <link rel="icon" href="./img/favicon.png" type="image/png">
</head>
<body class="thankyou-page">
  <main class="thankyou-shell">
    <section class="thankyou-card" aria-labelledby="thanksTitle">
      <a class="brand thankyou-brand" href="./index.html" aria-label="Volver al inicio de HexaSec">
        <img class="brand__logo" src="./img/H.png" alt="Logo HexaSec S.A.S.">
        <span class="brand__name">HexaSec S.A.S.</span>
      </a>
      <div class="thankyou-icon" aria-hidden="true">✓</div>
      <span class="eyebrow">SOLICITUD REGISTRADA</span>
      <h1 id="thanksTitle">Gracias por contactarnos.</h1>
      <p class="lead">Recibimos tu solicitud y nuestro equipo la revisará en un plazo estimado de un día hábil.</p>
      <div class="thankyou-reference" id="referenceBox" hidden>
        <span>Referencia</span>
        <strong id="referenceValue"></strong>
      </div>
      <p class="muted">También recibirás un correo automático de confirmación en la dirección que registraste.</p>
      <div class="thankyou-actions">
        <a class="btn btn--motion" href="./index.html">Volver al inicio</a>
        <a class="btn btn--ghost btn--motion" href="./gap/index.html">Diagnóstico GAP</a>
      </div>
    </section>
  </main>
  <script>
    const ref = new URLSearchParams(location.search).get('ref');
    if (ref) {
      document.getElementById('referenceValue').textContent = ref;
      document.getElementById('referenceBox').hidden = false;
    }
  </script>
</body>
</html>
